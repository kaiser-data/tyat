name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: pipx run ruff==0.17.3 check .
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Smoke test
        env:
          TYAT_TASKS: ${{ runner.temp }}/tasks.md
          TYAT_ROOT: ${{ runner.temp }}
        run: |
          ./tyat --version
          ./tyat add Smoke test tomorrow 14:00 !!
          ./tyat next a "check output"
          ./tyat snooze a 2h
          ./tyat ls < /dev/null
          ./tyat done a
          grep -q '^- \[x\] Smoke test' "$TYAT_TASKS"
          ! ./tyat bogus
